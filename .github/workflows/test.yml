name: Test Honduras Excel downloads
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: node --version
      - run: npm install --ignore-scripts --package-lock=false
      - run: npm test

  sync-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: npm exec --yes --package=pnpm@9 -- pnpm install --lockfile-only --ignore-scripts
      - name: Export generated dependency lock
        run: node -e "process.stdout.write('PNPM_LOCK_START\\n'+require('fs').readFileSync('pnpm-lock.yaml').toString('base64')+'\\nPNPM_LOCK_END\\n')"
